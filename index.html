.proof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pf{background:#FFFFFF;border:1px solid #DCE4F2;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px;transition:translate .25s,box-shadow .25s,border-color .2s}
.pf:hover{translate:0 -4px;box-shadow:0 14px 28px rgba(28,36,64,.12);border-color:#2457E6}
.pfn{font-family:Outfit,sans-serif;font-weight:600;font-size:22px;color:#CC4116}
.pft{margin:0;font-size:17px;font-weight:600;line-height:1.4;color:#1C2440}
.pfd{margin:0;font-size:14px;line-height:1.65;color:#4A5370;flex:1}
.pfl{display:flex;gap:8px;flex-wrap:wrap}
.pfl a{font-size:13px;font-weight:600;color:#2457E6;text-decoration:none;background:#E3EBFF;border-radius:999px;padding:8px 12px;min-height:36px;box-sizing:border-box;display:inline-flex;align-items:center;transition:background .2s,color .2s}
.pfl a{gap:8px;padding:5px 14px 5px 5px !important;min-height:40px !important}
.plg{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:999px;background:#FFFFFF;box-shadow:0 0 0 1px #DCE4F2}
.plg img{height:22px;width:auto;max-width:60px;object-fit:contain;display:block}
.pfl a:hover{background:#2457E6;color:#FFFFFF}
.dfil{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 4px}
.dbtn{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid #D3DDEE;background:#FFFFFF;color:#1C2440;border-radius:999px;padding:9px 14px;min-height:44px;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,border-color .2s}
.dbtn:hover{border-color:#2457E6}
.dbtn[aria-pressed="true"]{background:#1C2440;border-color:#1C2440;color:#FFFFFF}
.dcnt{font-family:Outfit,sans-serif;font-size:12px;background:#EEF2FA;color:#36405E;border-radius:999px;padding:1px 7px}
.dbtn[aria-pressed="true"] .dcnt{background:#DFFF1A;color:#1C2440}
@media (max-width:1000px){.proof{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.proof{grid-template-columns:minmax(0,1fr)}.dfil{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.dbtn{flex:0 0 auto}}
/* stats v2 */
.stats2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#FFFFFF;border-radius:22px;box-shadow:0 14px 34px rgba(10,20,70,.18);overflow:hidden}
.stats2 .st{display:flex;flex-direction:column;gap:4px;padding:20px 24px;text-decoration:none;color:#1C2440;position:relative;transition:background .2s}
.stats2 .st + .st::before{content:'';position:absolute;left:0;top:20px;bottom:20px;width:1px;background:#DCE4F2}
.stats2 .st:hover{background:#F3F6FD}
.stats2 .stn{display:flex;align-items:baseline;font-family:Outfit,sans-serif;font-weight:600;font-size:clamp(32px,4vw,40px);line-height:1.1;color:#2457E6;letter-spacing:-.02em}
.stats2 .stp{color:#CC4116}
.stats2 .stu{font-family:'IBM Plex Sans Thai',sans-serif;font-size:16px;font-weight:600;color:#1C2440;margin-left:8px;letter-spacing:0}
.stats2 .stl{font-size:13px;line-height:1.5;color:#5A6380}
@media (max-width:820px){.stats2{grid-template-columns:repeat(2,minmax(0,1fr))}.stats2 .st:nth-child(3)::before{display:none}.stats2 .st:nth-child(n+3){border-top:1px solid #DCE4F2}}
@media (max-width:380px){.stats2 .st{padding:16px}}
/* interaction system v1 — one hover language for the whole site */
:root{--ix-ease:cubic-bezier(.2,.8,.2,1);--ix-ring:#DFFF1A;--ix-shadow:0 18px 36px rgba(10,20,70,.18);--ix-tint:#EEF3FF}
/* 1 · Cards: lift + shadow + lime ring */
.pcard,.pf,.lift,.jobcard,.stepbtn,.card,.g3 > div,.g4 > div,.opt,.ptab,.nextcard,.ppanel,.tldr2 > div,.mcol,.shcol,.gantt,.receipt,.shot{transition:translate .3s var(--ix-ease),box-shadow .3s var(--ix-ease),outline-color .2s,background .2s,transform .15s ease-out !important;outline:2px solid transparent;outline-offset:3px}
.pcard:hover,.pf:hover,.lift:hover,.jobcard:hover,.stepbtn:hover,.card:hover,.g3 > div:hover,.g4 > div:hover,.opt:hover,.ptab:hover,.nextcard:hover,.tldr2 > div:hover,.mcol:hover,.shcol:hover,.receipt:hover{translate:0 -6px !important;rotate:none !important;scale:none !important;box-shadow:var(--ix-shadow) !important;outline-color:var(--ix-ring) !important}
.pcard:active,.pf:active,.stepbtn:active,.opt:active,.ptab:active,.nextcard:active,.jobcard:active{scale:.985 !important}
/* 2 · Chips & pills: small lift + lime tint */
.cl,.pill,.tool,.cert,.tag,.chip,.pfl a,.dbtn,.team span,.sticky,.badge,.pchip,.life a,.toc a{transition:translate .2s var(--ix-ease),background .2s,color .2s,box-shadow .2s,border-color .2s !important}
.pill:hover,.tool:hover,.cert:hover,.chip:hover,.pfl a:hover,.dbtn:hover,.team span:hover,.sticky:hover,.life a:hover{translate:0 -3px !important;rotate:none !important;scale:none !important;box-shadow:0 8px 16px rgba(10,20,70,.14) !important}
.cl:hover{translate:0 -3px !important}
.pill:hover,.tag:hover,.chip:hover,.team span:hover,.sticky:hover,.pchip:hover{background:var(--ix-ring) !important;color:#1C2440 !important}
.tool:hover img,.cert:hover .logo{rotate:none !important;scale:1.08 !important}
/* 3 · Buttons: lift + press */
.btn,.navcta,.backbtn,.pnav,.pmore,footer a,footer button,.totop{transition:translate .2s var(--ix-ease),box-shadow .2s,background .2s,color .2s,scale .1s !important}
.btn:hover,.navcta:hover,.backbtn:hover,.pnav:hover,footer a:hover,footer button:hover,.totop:hover{translate:0 -2px !important;box-shadow:0 10px 20px rgba(10,20,70,.2) !important}
.btn:active,.navcta:active,.backbtn:active,.pnav:active,footer a:active,footer button:active,.dbtn:active,.ck:active{scale:.97 !important}
/* 4 · Rows inside a group: tint only, no lift */
.stats2 .st:hover,.jobbtn:hover,.shrow:hover,.ck:hover,.navlink:hover,.toc a:hover{translate:none !important;background:var(--ix-tint) !important}
/* Focus: same lime ring for keyboard users */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ix-ring) !important;outline-offset:3px !important}
@media (hover:none){.pcard:hover,.pf:hover,.lift:hover,.jobcard:hover,.card:hover,.g3 > div:hover,.g4 > div:hover,.opt:hover,.ptab:hover,.nextcard:hover,.tldr2 > div:hover,.mcol:hover,.shcol:hover,.receipt:hover{translate:none !important;outline-color:transparent !important}}
@media (prefers-reduced-motion:reduce){*{translate:none !important}}
/* stats interaction v1 */
.stats2 .st::after{content:'';position:absolute;left:24px;right:24px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#2457E6;scale:0 1;transform-origin:0 50%;transition:scale .35s var(--ix-ease,ease)}
.stats2 .st::after{display:none}
.stats2 .stn{transition:color .25s,translate .3s var(--ix-ease,ease)}
.stats2 .st:hover .stn{color:#CC4116;translate:0 -2px}
.stats2 .st:hover .stp{color:#2457E6}
.stats2 .sta{font-size:12px;font-weight:600;color:#2457E6;opacity:0;translate:-6px 0;transition:opacity .25s,translate .3s var(--ix-ease,ease);margin-top:2px}
.stats2 .st:hover .sta,.stats2 .st:focus-visible .sta{opacity:1;translate:0 0}
.stats2 .st:active{scale:.98}
.stats2 .st{border-radius:18px;outline:3px solid transparent;outline-offset:-5px;transition:background .2s,outline-color .2s,scale .1s !important}
.stats2 .st:hover,.stats2 .st:focus-visible{outline-color:#DFFF1A !important;outline-offset:-5px !important}
/* stats tiles v3 */
.stats2{background:transparent !important;box-shadow:none !important;overflow:visible !important;gap:14px;border-radius:0}
.stats2 .st{background:linear-gradient(135deg,#E6EEFF 0%,#EEF3FF 55%,#F4FBD2 100%) !important;border:1px solid rgba(255,255,255,.9);border-radius:22px !important;padding:20px 22px !important;box-shadow:0 10px 26px rgba(10,20,70,.16);outline:2px solid transparent !important;outline-offset:3px !important;transition:translate .3s var(--ix-ease),box-shadow .3s var(--ix-ease),outline-color .2s,scale .1s !important}
.stats2 .st + .st::before{display:none !important}
.stats2 .stl{color:#2E3754 !important;font-size:14px !important;font-weight:500}
.stats2 .st:nth-child(n+3){border-top:1px solid rgba(255,255,255,.9) !important}
.stats2 .st:hover,.stats2 .st:focus-visible{translate:0 -6px !important;box-shadow:var(--ix-shadow) !important;outline-color:var(--ix-ring) !important}
.stats2 .st:active{scale:.985}
@media (max-width:820px){.stats2{gap:10px}}
@media (hover:none){.stats2 .sta{opacity:1;translate:0 0}}
</style>
