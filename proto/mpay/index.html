<head>

<title>AIS mPAY ONE · Prototype · Theechaya S.</title>

<style>
:root{--navy:#1C2440;--lime:#DFFF1A;--blue:#2457E6;--mute:#5A6380;--bg:#EEF2FB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;color:var(--navy)}
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;box-shadow:0 6px 18px rgba(10,20,60,.25)}
.bar a.x{color:#fff;text-decoration:none;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.1)}
.bar a.x:hover{background:var(--lime);color:var(--navy)}
.bar .tt{display:flex;flex-direction:column;min-width:0;flex:1}
.bar .tt small{color:#AEB8DA;font-size:12px}
.bar .tt b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ctl{display:flex;gap:6px;align-items:center}
.bar button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:10px;padding:8px 12px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.bar button:hover:not(:disabled){background:var(--lime);color:var(--navy)}
.bar button:disabled{opacity:.35;cursor:default}
.bar button[aria-pressed="true"]{background:var(--lime);color:var(--navy)}
.bar .sn{font-variant-numeric:tabular-nums;color:var(--lime);font-weight:700;font-size:13px;padding:0 4px}
.hintw{max-width:1320px;margin:14px auto 0;padding:0 16px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute)}
.hintw i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px rgba(223,255,26,.35)}
.wrap{max-width:1320px;margin:10px auto 0;padding:0 16px 150px}
#stage{position:relative;margin:0 auto;width:fit-content;max-width:100%;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(10,20,70,.18);opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s}
#stage.in{opacity:1;transform:none}
#scr{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 250px);min-height:240px;margin:0 auto;user-select:none;-webkit-user-drag:none}
#spots{position:absolute;inset:0}
.hs{position:absolute;border:0;padding:0;background:transparent;border-radius:8px;cursor:pointer}
.hs:hover,.hs:focus-visible{background:rgba(223,255,26,.28);outline:2px solid #B8D400;outline-offset:0}
.hs.fl{animation:fl 1.1s ease-out}
.hs.main.fl{animation:fl 1.1s ease-out,pz 1.6s 1.1s ease-in-out 2}
@keyframes fl{0%{background:rgba(223,255,26,.0);outline:2px solid rgba(184,212,0,0)}25%{background:rgba(223,255,26,.45);outline:2px solid #B8D400}100%{background:rgba(223,255,26,0);outline:2px solid rgba(184,212,0,0)}}
@keyframes pz{50%{box-shadow:0 0 0 6px rgba(223,255,26,.55)}}
body.showall .hs{background:rgba(223,255,26,.25);outline:2px dashed #9DB500}
.strip{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(28,36,64,.96);backdrop-filter:blur(8px);display:flex;gap:10px;overflow-x:auto;padding:10px 16px;scrollbar-width:thin}
.th{flex:none;width:150px;border:2px solid transparent;border-radius:10px;background:rgba(255,255,255,.06);padding:6px;color:#fff;font:inherit;text-align:left;cursor:pointer;position:relative}
.th img{display:block;width:100%;height:78px;object-fit:cover;object-position:top;border-radius:6px;background:#fff}
.th .tl{display:block;font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#D6DCF5}
.th .tn{position:absolute;top:10px;left:10px;background:var(--navy);color:var(--lime);font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.th.on{border-color:var(--lime)}
.th:hover{border-color:rgba(223,255,26,.5)}
.note{max-width:1320px;margin:14px auto 0;padding:0 16px;font-size:12.5px;color:var(--mute)}
#langsw{top:auto!important;bottom:118px!important;right:16px!important;left:auto!important}
@media (max-width:640px){.bar .tt small{display:none}.bar button span.l{display:none}.th{width:110px}.th img{height:58px}}
@media (prefers-reduced-motion:reduce){#stage,.hs{transition:none;animation:none!important}}
</style>
</head>

    <button type="button" id="toggle" aria-pressed="false">◎ <span class="l">แสดงจุดที่กดได้</span></button>
  </div>
</div>
<div class="hintw"><i></i><span id="hint"></span></div>
<div class="wrap"><div id="stage"><img id="scr" alt=""><div id="spots"></div></div></div>
